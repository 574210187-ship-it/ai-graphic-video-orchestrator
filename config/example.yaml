schema_version: 1

project:
  name: example-graphic-video
  actor_id: replace-with-unique-actor-id
  runs_dir: ../runs

production:
  enabled: false
  single_writer_required: true
  max_attempts_per_record: 3
  continue_after_record_failure: true

provider:
  type: fixture
  fixture_file: ../tests/fixtures/records.json

fields:
  classification: 二次分类型
  classification_value: 图文
  classification_fallback: 类型
  classification_fallback_value: 图文
  source_priority:
    - 人工_对标视频
    - 对标视频
    - 对标视频、图文
  product: 成品
  published: 已发布
  status: 状态
  completed_status: 完成视频
  note: zed备注
  execution_log: 执行记录

queue:
  mode: both_output_columns_without_video
  video_extensions: [.mp4, .mov, .m4v, .webm, .mkv]
  denylist: []

business:
  profile_name: replace-with-local-business-profile
  route_config: ./business-profile.example.yaml
  stage0_command: []
  planner_command: []

engine:
  name: fixture
  command: []
  timeout_seconds: 3600

writeback:
  replace_same_name: false
  delete_local_media_after_verified_readback: true
